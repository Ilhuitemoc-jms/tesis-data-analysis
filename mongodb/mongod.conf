# mongodb/mongod.conf
# Configuración optimizada para MongoDB 7.0 con 166M registros
#Lenguaje: YAML (Yet Another Markup Language)

storage:
  # Ruta de almacenamiento de datos
  dbPath: /data/db
  # WiredTiger es el motor por defecto (no necesitas especificarlo)
  wiredTiger:
    engineConfig:
      # Cache de 2GB (ajustable según memoria disponible)
      cacheSizeGB: 2
      # Compresión para ahorrar espacio
      journalCompressor: snappy
    collectionConfig:
      # Compresión de documentos
      blockCompressor: snappy
    indexConfig:
      # Usa prefijos de compresión en índices
      prefixCompression: true

systemLog:
  # Logging para monitoreo
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  # Nivel de verbosidad
  verbosity: 0

net:
  # Puerto estándar
  port: 27017
  # Acepta conexiones desde cualquier IP
  bindIp: 0.0.0.0
  # Compresión de red
  compression:
    compressors: snappy,zstd,zlib

processManagement:
  # Zona horaria
  timeZoneInfo: /usr/share/zoneinfo

security:
  # Autenticación habilitada
  authorization: enabled

# Configuración para escrituras masivas
operationProfiling:
  # Desactiva profiling durante carga
  mode: off

setParameter:
  # Aumenta límite de escrituras concurrentes
  wiredTigerConcurrentWriteTransactions: 256
  # Aumenta límite de lecturas concurrentes
  wiredTigerConcurrentReadTransactions: 256
